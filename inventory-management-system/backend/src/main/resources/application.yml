server:
  port: ${PORT:8081}

spring:
  application:
    name: inventory-management-system
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:supply_lens;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
    show-sql: false
    database-platform: ${SPRING_JPA_PLATFORM:org.hibernate.dialect.H2Dialect}
  jackson:
    serialization:
      write-dates-as-timestamps: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  data:
    csv-path: classpath:data/
